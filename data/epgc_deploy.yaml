apiVersion: apps/v1
kind: Deployment
metadata:
  name: epgc-project
  labels:
    app: epgc-deployment
spec:
  replicas: 5
  selector:
    matchLabels:
      app: epgc-deployment
  template:
    metadata:
      labels:
        app: epgc-deployment
    spec:
      containers:
      - name: epgc-deployment
        image: javidgull/devops_epgc_project
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: epgc-service
spec:
  type: NodePort
  selector:
    app: epgc-deployment
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30010
